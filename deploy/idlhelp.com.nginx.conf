# Initial HTTP configuration. Run Certbot after DNS points to this server;
# Certbot will add HTTPS and redirect HTTP traffic.
server {
    listen 80;
    server_name idlhelp.com www.idlhelp.com;

    root /var/www/idlhelp.com/current;
    # Only the one-page site is public; the export also contains template demos.
    location = / {
        try_files /index.html =404;
    }

    location = /icon.png {
        try_files $uri =404;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /images/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
