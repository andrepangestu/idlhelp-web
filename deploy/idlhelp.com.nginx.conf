# HTTPS configuration for idlhelp.com. Certbot manages the certificate paths.
server {
    server_name idlhelp.com www.idlhelp.com;

    root /var/www/idlhelp.com/current;
    # Only the one-page site is public; the export also contains template demos.
    location = / {
        try_files /index.html =404;
    }

    location = /icon.png {
        try_files $uri =404;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /images/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/idlhelp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/idlhelp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.idlhelp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = idlhelp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name idlhelp.com www.idlhelp.com;
    return 404; # managed by Certbot




}
