# Netlify configuration for idlhelp-web (static export of a Next.js site).
#
# Deploys normally come from GitHub Actions (.github/workflows/deploy.yml), which builds
# the site and uploads the `out/` folder. The [build] block below makes Netlify's own Git
# integration or a local `netlify build` produce the same output.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Hashed Next.js assets never change, cache them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # TEMPORARY: keeps the staging site out of search engines while placeholder
    # contact details are live. Remove this line before the real launch.
    X-Robots-Tag = "noindex, nofollow"
