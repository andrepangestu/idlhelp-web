name: Build and deploy

on:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: |
          test -f out/index.html
          test -f out/icon.png
          echo "Export OK: $(find out -type f | wc -l) files"

      - name: Upload static export
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy main to server
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: 206.189.84.142
      DEPLOY_USER: idlhelp-deploy
      DEPLOY_BASE: /var/www/idlhelp.com
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout pinned SSH host key
        uses: actions/checkout@v4

      - name: Check server credentials
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo '::error::DEPLOY_SSH_PRIVATE_KEY is missing'; exit 1; }

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out/

      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          cp deploy/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Upload release and activate it
        run: |
          ssh -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_BASE/releases/$GITHUB_SHA'"
          rsync -az --delete \
            -e 'ssh -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            out/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE/releases/$GITHUB_SHA/"
          ssh -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; test -f '$DEPLOY_BASE/releases/$GITHUB_SHA/index.html'; ln -sfn 'releases/$GITHUB_SHA' '$DEPLOY_BASE/current.next'; mv -Tf '$DEPLOY_BASE/current.next' '$DEPLOY_BASE/current'"
          echo "Published commit $GITHUB_SHA to $DEPLOY_HOST" >> "$GITHUB_STEP_SUMMARY"
