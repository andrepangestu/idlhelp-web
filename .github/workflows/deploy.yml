name: Build and deploy

on:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release operations
        run: bash deploy/test-release.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: |
          test -f out/index.html
          test -f out/icon.png
          echo "Export OK: $(find out -type f | wc -l) files"

      - name: Upload static export
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy main to server
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: 206.189.84.142
      DEPLOY_USER: idlhelp-deploy
      DEPLOY_BASE: /var/www/idlhelp.com

    steps:
      - name: Checkout pinned SSH host key
        uses: actions/checkout@v4

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out/

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo '::error::DEPLOY_SSH_PRIVATE_KEY is missing'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          cp deploy/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Upload release and activate it
        run: |
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_options=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" "$remote" "mkdir -p '$DEPLOY_BASE/releases/$release_id'"
          rsync -az --delete \
            -e 'ssh -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            out/ "$remote:$DEPLOY_BASE/releases/$release_id/"
          previous=$(ssh "${ssh_options[@]}" "$remote" bash -s -- activate "$DEPLOY_BASE" "$release_id" < deploy/release.sh)

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 15 \
              --resolve "idlhelp.com:443:$DEPLOY_HOST" -o "$response_file" https://idlhelp.com/ \
              || ! cmp -s out/index.html "$response_file"; then
            echo '::error::Production health check failed; restoring the previous release'
            ssh "${ssh_options[@]}" "$remote" bash -s -- rollback "$DEPLOY_BASE" "$previous" < deploy/release.sh
            exit 1
          fi

          ssh "${ssh_options[@]}" "$remote" bash -s -- prune "$DEPLOY_BASE" 5 < deploy/release.sh
          echo "Published commit $GITHUB_SHA to $DEPLOY_HOST; previous release: $previous" >> "$GITHUB_STEP_SUMMARY"
